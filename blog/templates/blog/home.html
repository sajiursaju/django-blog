{% extends "base.html" %}

{% block title %}Home - Django Blog{% endblock %}

{% block content %}

<h1>Latest Posts</h1>

{% for post in posts %}

    <article class="post-card">

        <h2>
            <a href="{% url 'post_detail' post.slug %}">
                {{ post.title }}
            </a>
        </h2>

        <p class="post-content">
            {{ post.content }}
        </p>

        <p class="post-date">
            Published {{ post.created_at }}
        </p>

    </article>

{% empty %}

    <p>No posts available yet.</p>

{% endfor %}

{% endblock %}
